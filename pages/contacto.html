<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- fuente -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lycian&family=Oxanium:wght@400;600;800&family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- mis estilos -->
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto — iCarry</title>
  </head>

  <body>
    <!-- cabecera de la pagina -->
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img src="../img/logo.svg" alt="iCarry" class="logo-img" />
        </a>
      </div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
          <li>
            <a href="./carrito.html" class="carrito-icono">
              🛒 <span id="contador-carrito">0</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- formulario de contacto -->
    <main>
      <h1 class="titulo-contacto text-secondary">Contactanos</h1>

      <!-- mando a formspree -->
      <form class="form-contacto" action="https://formspree.io/f/xgopzyyy" method="POST">
        <div class="grupo-input">
          <label for="email">Su email:</label>
          <input id="email" type="email" name="email" />
        </div>

        <div class="grupo-input">
          <label for="mensaje">Su mensaje:</label>
          <textarea id="mensaje" name="message"></textarea>
        </div>

        <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
      </form>
    </main>

    <!-- pie -->
    <footer>
      <p>Sitio realizado por Alex Quiñones</p>
      <nav>
        <ul class="footer-list">
          <li><img src="../img/whatsapp.png" alt="wpp" /></li>
          <li><img src="../img/social.png" alt="ig" /></li>
        </ul>
      </nav>
    </footer>

    <!-- script -->
    <script type="module" src="../js/contacto.js"></script>
  </body>
</html>
