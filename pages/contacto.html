<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto — iCarry</title>
  </head>

  <body>
    <!-- HEADER -->
    <!-- Cabecera del sitio con el logo y el menu de navegacion. -->
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img src="../img/logo.jpg" alt="iCarry — Tienda Dota 2" class="logo-img" />
        </a>
      </div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <!-- MAIN -->
    <!-- Contenido principal de la pagina con el titulo y el formulario. -->
    <main>

      <h1 class="titulo-contacto text-secondary">Contactanos</h1>

      <!-- Formulario -->
      <!-- Campos para que el usuario deje su email y su mensaje. -->
      <form class="form-contacto" action="https://formspree.io/f/xgopzyyy" method="POST">

        <div class="grupo-input">
          <label for="email">Su email:</label>
          <input id="email" type="email" name="email" />
        </div>

        <div class="grupo-input">
          <label for="mensaje">Su mensaje:</label>
          <textarea id="mensaje" name="message"></textarea>
        </div>

        <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
      </form>
    </main>
    <!-- FOOTER -->
    <!-- Pie de pagina con el credito del autor y los iconos sociales. -->
    <footer>
      <p>Sitio realizado por Alex Quiñones</p>
      <nav>
        <ul class="footer-list">
          <li><img src="../img/whatsapp.png" alt="logo de whatsapp" /></li>
          <li><img src="../img/social.png" alt="logo de instagram" /></li>
        </ul>
      </nav>
    </footer>

  </body>
</html>
